const quiz=document.getElementById("quiz");

questions.forEach((q,index)=>{

let html=`<div class='question'>
<h3>${q.q}</h3>`;

q.o.forEach((opt,i)=>{
html+=`
<label>
<input type='radio' name='q${index}' value='${i}'>
${opt}
</label><br>`;
});

html+="</div>";

quiz.innerHTML+=html;
});

function submitQuiz(){

let score=0;

questions.forEach((q,index)=>{

let ans=document.querySelector(`input[name=q${index}]:checked`);

if(ans && Number(ans.value)===q.a)
score++;

});

let percent=((score/questions.length)*100).toFixed(2);

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=`
<h2>Exam Report</h2>
<p><b>Total Questions:</b> ${questions.length}</p>
<p><b>Correct:</b> ${score}</p>
<p><b>Wrong:</b> ${questions.length-score}</p>
<p><b>Percentage:</b> ${percent}%</p>
<p><b>Result:</b> ${percent>=50 ? "PASS" : "FAIL"}</p>
`;

window.scrollTo(0,document.body.scrollHeight);
}

</script>
