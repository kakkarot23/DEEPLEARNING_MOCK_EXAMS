<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHATECH Examination - Point Estimation & Bias Variance</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}
h1{
    text-align:center;
    color:#003366;
}
.student-box{
    margin-bottom:20px;
}
.student-box input{
    width:100%;
    padding:12px;
    font-size:16px;
}
.question{
    margin-top:20px;
    padding:15px;
    background:#fafafa;
    border-left:5px solid #007bff;
    border-radius:5px;
}
.question h3{
    margin-top:0;
}
label{
    display:block;
    margin:8px 0;
}
.submit-btn{
    background:#28a745;
    color:white;
    padding:15px 40px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}
.submit-btn:hover{
    background:#218838;
}
.result-card{
    display:none;
    margin-top:30px;
    padding:25px;
    background:#f8f9fa;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}
.pass{
    color:green;
    font-size:24px;
    font-weight:bold;
}

    color:red;
    font-size:24px;
    font-weight:bold;
}

    margin:auto;
}
td{
    padding:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>SHATECH MCQ Examination</h1>
<h2 style="text-align:center;">Point Estimation, Bias, Variance & Cross Validation</h2>

<div class="student-box">
<label><b>Student Name</b></label>
<input type="text" id="studentName" placeholder="Enter Student Name">
</div>

<!-- Paste ALL YOUR Q1-Q30 QUESTION BLOCKS HERE -->

<!-- Questions already provided by you -->

<div style="text-align:center;margin-top:30px;">
<button class="submit-btn" onclick="submitExam()">
Submit Examination
</button>
</div>

<div id="resultCard" class="result-card">
<h2 style="text-align:center;">FINAL RESULT</h2>

<table>
<tr>
<td><b>Student Name</b></td>
<td id="r_name"></td>
</tr>

<tr>
<td><b>Total Questions</b></td>
<td>30</td>
</tr>

<tr>
<td><b>Correct Answers</b></td>
<td id="r_correct"></td>
</tr>

<tr>
<td><b>Wrong Answers</b></td>
<td id="r_wrong"></td>
</tr>

<tr>
<td><b>Marks Obtained</b></td>
<td id="r_marks"></td>
</tr>

<tr>
<td><b>Percentage</b></td>
<td id="r_percentage"></td>
</tr>
</table>

<div id="r_status" style="text-align:center;margin-top:20px;"></div>

</div>

</div>

<script>

const answers = {
q1:"c",
q2:"b",
q3:"c",
q4:"b",
q5:"a",
q6:"b",
q7:"b",
q8:"b",
q9:"a",
q10:"b",
q11:"c",
q12:"b",
q13:"a",
q14:"c",
q15:"b",
q16:"a",
q17:"c",
q18:"b",
q19:"a",
q20:"a",
q21:"b",
q22:"a",
q23:"c",
q24:"a",
q25:"a",
q26:"c",
q27:"b",
q28:"a",
q29:"c",
q30:"b"
};

function submitExam(){

let score = 0;

for(let i=1;i<=30;i++){

let selected =
document.querySelector('input[name="q'+i+'"]:checked');

if(selected && selected.value === answers['q'+i]){
score++;
}
}

let wrong = 30 - score;
let percentage = ((score/30)*100).toFixed(2);
let status = score >= 15 ? "PASS" : "FAIL";

document.getElementById("r_name").innerHTML =
document.getElementById("studentName").value;

document.getElementById("r_correct").innerHTML = score;
document.getElementById("r_wrong").innerHTML = wrong;
document.getElementById("r_marks").innerHTML = score + "/30";
document.getElementById("r_percentage").innerHTML = percentage + "%";

let statusDiv = document.getElementById("r_status");

statusDiv.innerHTML = status;

if(status==="PASS"){
statusDiv.className="pass";
}
else{
statusDiv.className="fail";
}

document.getElementById("resultCard").style.display="block";

window.scrollTo({
top:document.body.scrollHeight,
behavior:'smooth'
});
}

</script>

</body>
</html>
