<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHATECH MCQ Examination</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}
h1{
    text-align:center;
    color:#003366;
}
.question{
    margin-top:20px;
    padding:15px;
    background:#fafafa;
    border-left:5px solid #007bff;
}
.question h3{
    margin-top:0;
}
label{
    display:block;
    margin:8px 0;
}
.student-box{
    margin-bottom:20px;
}
.student-box input{
    width:100%;
    padding:10px;
    font-size:16px;
}
.submit-btn{
    background:#28a745;
    color:white;
    padding:15px 40px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
.submit-btn:hover{
    background:#1e7e34;
}
.result-card{
    display:none;
    margin-top:30px;
    padding:20px;
    background:#f8f9fa;
    border-radius:10px;
    text-align:center;
}
.pass{
    color:green;
    font-weight:bold;
    font-size:24px;
}
.fail{
    color:red;
    font-weight:bold;
    font-size:24px;
}
</style>
</head>

<body>

<div class="container">

<h1>SHATECH MCQ Examination</h1>

<div class="student-box">
<label><b>Student Name</b></label>
<input type="text" id="studentName" placeholder="Enter Name">
</div>

<!-- Q1 -->
<div class="question">
<h3>1. What is point estimation?</h3>
<label><input type="radio" name="q1" value="a"> Estimating multiple values</label>
<label><input type="radio" name="q1" value="b"> Estimating a probability distribution</label>
<label><input type="radio" name="q1" value="c"> Providing a single best estimate of a parameter</label>
<label><input type="radio" name="q1" value="d"> Clustering data</label>
</div>

<!-- Q2 -->
<div class="question">
<h3>2. Bias measures:</h3>
<label><input type="radio" name="q2" value="a"> Computational cost</label>
<label><input type="radio" name="q2" value="b"> Difference between expected estimate and true value</label>
<label><input type="radio" name="q2" value="c"> Number of parameters</label>
<label><input type="radio" name="q2" value="d"> Variance of data</label>
</div>

<!-- Q3 -->
<div class="question">
<h3>3. An unbiased estimator has:</h3>
<label><input type="radio" name="q3" value="a"> Variance = 0</label>
<label><input type="radio" name="q3" value="b"> Bias = 1</label>
<label><input type="radio" name="q3" value="c"> Bias = 0</label>
<label><input type="radio" name="q3" value="d"> Infinite variance</label>
</div>

<!-- Q4 -->
<div class="question">
<h3>4. Variance measures:</h3>
<label><input type="radio" name="q4" value="a"> Average prediction</label>
<label><input type="radio" name="q4" value="b"> Spread of estimator values across samples</label>
<label><input type="radio" name="q4" value="c"> Number of features</label>
<label><input type="radio" name="q4" value="d"> Learning rate</label>
</div>

<!-- Q5 -->
<div class="question">
<h3>5. Standard Error is:</h3>
<label><input type="radio" name="q5" value="a"> √Variance</label>
<label><input type="radio" name="q5" value="b"> Variance²</label>
<label><input type="radio" name="q5" value="c"> Bias²</label>
<label><input type="radio" name="q5" value="d"> MSE</label>
</div>

<!-- ADD Q6 TO Q30 HERE -->

<div style="text-align:center;margin-top:30px;">
<button class="submit-btn" onclick="submitExam()">
Submit Examination
</button>
</div>

<div id="resultCard" class="result-card">
<h2>Examination Result</h2>

<p><b>Student:</b> <span id="r_name"></span></p>
<p><b>Correct Answers:</b> <span id="r_correct"></span></p>
<p><b>Wrong Answers:</b> <span id="r_wrong"></span></p>
<p><b>Marks:</b> <span id="r_marks"></span></p>
<p><b>Percentage:</b> <span id="r_percentage"></span></p>

<div id="r_status"></div>

</div>

</div>

<script>

const answers = {
q1:"c",
q2:"b",
q3:"c",
q4:"b",
q5:"a",
q6:"b",
q7:"b",
q8:"b",
q9:"a",
q10:"b",
q11:"c",
q12:"b",
q13:"a",
q14:"c",
q15:"b",
q16:"a",
q17:"c",
q18:"b",
q19:"a",
q20:"a",
q21:"b",
q22:"a",
q23:"c",
q24:"a",
q25:"a",
q26:"c",
q27:"b",
q28:"a",
q29:"c",
q30:"b"
};

function submitExam(){

let score = 0;

for(let i=1;i<=30;i++){

let selected =
document.querySelector('input[name="q'+i+'"]:checked');

if(selected && selected.value===answers['q'+i]){
score++;
}
}

let wrong = 30-score;
let percentage=((score/30)*100).toFixed(2);
let status = score>=15 ? "PASS" : "FAIL";

document.getElementById("r_name").innerHTML =
document.getElementById("studentName").value;

document.getElementById("r_correct").innerHTML=score;
document.getElementById("r_wrong").innerHTML=wrong;
document.getElementById("r_marks").innerHTML=score+"/30";
document.getElementById("r_percentage").innerHTML=percentage+"%";

let statusDiv=document.getElementById("r_status");
statusDiv.innerHTML=status;
statusDiv.className=(status==="PASS")?"pass":"fail";

document.getElementById("resultCard").style.display="block";

window.scrollTo({
top:document.body.scrollHeight,
behavior:'smooth'
});

}

</script>

</body>
</html>
