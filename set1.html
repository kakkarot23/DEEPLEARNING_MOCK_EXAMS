```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHATECH MCQ Examination - Set 1</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#003366;
}

.student-box{
    margin-bottom:20px;
}

.student-box input{
    width:100%;
    padding:12px;
    font-size:16px;
}

.question{
    margin-top:20px;
    padding:15px;
    background:#fafafa;
    border-left:5px solid #007bff;
    border-radius:5px;
}

.question p{
    font-weight:bold;
}

.option{
    margin:8px 0;
}

.submit-btn{
    background:#28a745;
    color:white;
    padding:15px 40px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

.submit-btn:hover{
    background:#1e7e34;
}

.result-card{
    margin-top:40px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
    text-align:center;
}

.pass{
    color:green;
    font-size:20px;
    font-weight:bold;
}

.fail{
    color:red;
    font-size:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>SHATECH MCQ Examination - Set 1</h1>

<div class="student-box">
<label><b>Student Name</b></label>
<input type="text" id="studentNameInput" placeholder="Enter your name">
</div>

<div id="questions"></div>

<div style="text-align:center;margin-top:30px;">
<button class="submit-btn" onclick="submitExam()">
Submit Examination
</button>
</div>

<div id="resultCard" class="result-card" style="display:none;">

<h2>SHATECH Examination Result</h2>

<p><strong>Student:</strong>
<span id="studentName"></span>
</p>

<p><strong>Total Questions:</strong> 30</p>

<p><strong>Correct Answers:</strong>
<span id="correct"></span>
</p>

<p><strong>Score:</strong>
<span id="score"></span>/30
</p>

<p><strong>Percentage:</strong>
<span id="percentage"></span>%
</p>

<p><strong>Status:</strong>
<span id="status"></span>
</p>

</div>

</div>

<script>

const questions = [

{
q:"What are the three components of a Machine Learning system?",
o:["Data, Model, GPU","Task, Experience, Performance","Input, Output, Label","Training, Testing, Validation"]
},
{
q:"Which learning method uses labeled data?",
o:["Unsupervised","Reinforcement","Supervised","Clustering"]
},
{
q:"Which task predicts numerical values?",
o:["Classification","Regression","Clustering","Translation"]
},
{
q:"Credit card fraud detection is an example of:",
o:["Classification","Translation","Anomaly Detection","Sampling"]
},
{
q:"Which task fills missing values?",
o:["Denoising","Imputation","Sampling","Regression"]
},
{
q:"Which learning type discovers hidden patterns?",
o:["Supervised","Unsupervised","Reinforcement","Online"]
},
{
q:"Which model stores all training examples?",
o:["Linear Regression","CNN","k-NN","RNN"]
},
{
q:"High training and high test error indicate:",
o:["Overfitting","Underfitting","Generalization","Regularization"]
},
{
q:"Very low training error but high test error indicates:",
o:["Underfitting","Overfitting","Optimization","Validation"]
},
{
q:"Which theorem states no algorithm is best for every problem?",
o:["Bayes Theorem","Central Limit Theorem","No Free Lunch Theorem","Pythagoras Theorem"]
},
{
q:"What is the primary goal of Machine Learning?",
o:["Store data permanently","Learn patterns from data","Increase hardware speed","Replace databases"]
},
{
q:"Which dataset is used to evaluate model performance?",
o:["Training Set","Test Set","Input Set","Feature Set"]
},
{
q:"Which learning algorithm is commonly used for classification?",
o:["K-Means","PCA","Logistic Regression","Apriori"]
},
{
q:"What is a feature in Machine Learning?",
o:["Input variable","Output variable","Error value","Prediction"]
},
{
q:"Which metric is commonly used for classification accuracy?",
o:["Accuracy","RMSE","MAE","Variance"]
},
{
q:"Which method reduces overfitting?",
o:["Increasing noise","Regularization","Removing data","Random guessing"]
},
{
q:"Which algorithm belongs to supervised learning?",
o:["K-Means","PCA","Decision Tree","Association Rule Mining"]
},
{
q:"Which technique groups similar data points?",
o:["Regression","Clustering","Classification","Prediction"]
},
{
q:"What does AI stand for?",
o:["Artificial Intelligence","Automated Interface","Algorithm Integration","Artificial Input"]
},
{
q:"Which of the following is a regression problem?",
o:["House Price Prediction","Spam Detection","Face Recognition","Disease Classification"]
},
{
q:"What is the purpose of training data?",
o:["Testing model","Learning patterns","Visualization","Storage"]
},
{
q:"Which algorithm is commonly used for clustering?",
o:["Logistic Regression","Decision Tree","K-Means","Naive Bayes"]
},
{
q:"Which process removes noise from data?",
o:["Clustering","Denoising","Sampling","Classification"]
},
{
q:"What is the output of a classification model?",
o:["Category/Class","Continuous Value","Cluster","Feature"]
},
{
q:"Which learning type uses rewards and penalties?",
o:["Supervised","Unsupervised","Reinforcement","Batch Learning"]
},
{
q:"Which algorithm is used for image classification?",
o:["K-Means","PCA","CNN","Apriori"]
},
{
q:"What does ML stand for?",
o:["Machine Learning","Machine Logic","Memory Learning","Modern Learning"]
},
{
q:"Which type of error occurs when the model is too simple?",
o:["Overfitting","Underfitting","Validation","Sampling"]
},
{
q:"Which model is inspired by the human brain?",
o:["Linear Regression","Decision Tree","Neural Network","KNN"]
},
{
q:"Which field combines statistics and computer science?",
o:["Networking","Operating Systems","Machine Learning","Compiler Design"]
}
];

const answers = [
'b','c','b','c','b','b','c','b','b','c',
'b','b','c','a','a','b','c','b','a','a',
'b','c','b','a','c','c','a','b','c','c'
];

let html='';

questions.forEach((item,index)=>{

html += `
<div class="question">

<p>${index+1}. ${item.q}</p>

<div class="option">
<input type="radio" name="q${index+1}" value="a"> ${item.o[0]}
</div>

<div class="option">
<input type="radio" name="q${index+1}" value="b"> ${item.o[1]}
</div>

<div class="option">
<input type="radio" name="q${index+1}" value="c"> ${item.o[2]}
</div>

<div class="option">
<input type="radio" name="q${index+1}" value="d"> ${item.o[3]}
</div>

</div>
`;

});

document.getElementById("questions").innerHTML = html;

function submitExam(){

let score = 0;

for(let i=1;i<=30;i++){

let selected =
document.querySelector(`input[name="q${i}"]:checked`);

if(selected && selected.value===answers[i-1]){
score++;
}
}

let percentage =
((score/30)*100).toFixed(2);

let status =
score>=15 ? "PASS" : "FAIL";

document.getElementById("studentName").innerText =
document.getElementById("studentNameInput").value || "Not Entered";

document.getElementById("correct").innerText = score;
document.getElementById("score").innerText = score;
document.getElementById("percentage").innerText = percentage;

let statusElement =
document.getElementById("status");

statusElement.innerText = status;
statusElement.className =
score>=15 ? "pass" : "fail";

document.getElementById("resultCard").style.display="block";

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

</script>

</body>
</html>
